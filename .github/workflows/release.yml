name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Compile Installer
        run: |
          $paths = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
            "$env:ProgramW6432\Inno Setup 6\ISCC.exe"
          )
          $iscc = $null
          foreach ($p in $paths) { if (Test-Path $p) { $iscc = $p; break } }
          if (-not $iscc) { throw "ISCC.exe not found. Inno Setup may not be installed correctly." }
          Write-Host "Found ISCC.exe at: $iscc"
          & $iscc installer/setup.iss

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: |
            dist/Taul-v*.exe
          retention-days: 1

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 1

  create-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-build
          path: dist

      - name: Rename APK
        run: |
          version="${GITHUB_REF_NAME#v}"
          mv dist/app-release.apk "dist/Taul-v${version}.apk"

      - name: Generate manifest.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          exeName="Taul-v${version}-setup.exe"
          apkName="Taul-v${version}.apk"
          cat > dist/manifest.json << EOF
          {
            "version": "$version",
            "url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$exeName",
            "android_url": "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$apkName",
            "notes": "Consultá las release notes en GitHub para conocer las novedades."
          }
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Taul-v*-setup.exe
            dist/Taul-v*.apk
            dist/manifest.json
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}