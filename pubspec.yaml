name: taul
description: "Personal knowledge vault — minimal, fast, secure, sovereign."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Database
  drift: ^2.25.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  sqlite3: ^2.7.4
  cryptography: ^2.7.0

  # Code generation
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Utilities
  logger: ^2.5.0
  uuid: ^4.5.1
  intl: ^0.20.2

  # Markdown rendering
  flutter_markdown: ^0.7.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  drift_dev: ^2.25.1
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  riverpod_generator: ^2.6.3

  # Testing
  mocktail: ^1.0.4

  # Linting
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
